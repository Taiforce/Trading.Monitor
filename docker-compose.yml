name: trading-monitor

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: trading-monitor-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD:?Set SQLSERVER_SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:${SQLSERVER_PORT:-14333}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # One-shot job: creates a least-privilege SQL login for the app containers so
  # web/worker never authenticate as the `sa` (sysadmin) account. Runs once per
  # `docker compose up` and exits; web/worker wait for it to finish successfully.
  sql-init:
    image: mcr.microsoft.com/mssql-tools18:latest
    container_name: trading-monitor-sql-init
    restart: "no"
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./docker/init-app-user.sql:/init-app-user.sql:ro
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd"]
    command:
      - "-S"
      - "sqlserver,1433"
      - "-U"
      - "sa"
      - "-P"
      - "${SQLSERVER_SA_PASSWORD:?Set SQLSERVER_SA_PASSWORD in .env}"
      - "-C"
      - "-v"
      - "AppUser=${SQLSERVER_APP_USER:-trading_app}"
      - "-v"
      - "AppPassword=${SQLSERVER_APP_PASSWORD:?Set SQLSERVER_APP_PASSWORD in .env}"
      - "-i"
      - "/init-app-user.sql"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: trading-monitor-web:local
    container_name: trading-monitor-web
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "${WEB_PORT:-5088}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      TZ: ${APP_TIME_ZONE:-America/Mexico_City}
      TradingMonitor__DisplayTimeZone: ${APP_TIME_ZONE:-America/Mexico_City}
      Database__Provider: SqlServer
      Database__InitializeOnStartup: "true"
      Database__CreateIfMissing: "true"
      Database__ConnectionString: Server=sqlserver,1433;Database=TradingMarket;User Id=${SQLSERVER_APP_USER:-trading_app};Password=${SQLSERVER_APP_PASSWORD:?Set SQLSERVER_APP_PASSWORD in .env};TrustServerCertificate=True;Encrypt=True;MultipleActiveResultSets=True
      AdminAccess__Enabled: ${ADMIN_ACCESS_ENABLED:-true}
      AdminAccess__Username: ${ADMIN_ACCESS_USERNAME:-admin}
      AdminAccess__Password: ${ADMIN_ACCESS_PASSWORD:?Set ADMIN_ACCESS_PASSWORD in .env to a unique strong password (min 12 chars, not a well-known default)}
      AdminAccess__AllowAnonymousAccess: ${ADMIN_ACCESS_ALLOW_ANONYMOUS:-false}
      TRADING_MONITOR_LOG_DIRECTORY: /app/logs
      Logs__DirectoryPath: /shared-logs
      Reporting__DefaultCapital: ${REPORTING_DEFAULT_CAPITAL:-1000}
      Reporting__EstimatedFeePercentPerSide: ${REPORTING_FEE_PERCENT_PER_SIDE:-0.1}
      Reporting__MinimumNetProfitPercentAfterCosts: ${REPORTING_MIN_NET_PROFIT_AFTER_COSTS:-0.35}
      Risk__EstimatedFeePercentPerSide: ${RISK_FEE_PERCENT_PER_SIDE:-0.1}
      Risk__ManagedProfitExitEnabled: ${RISK_MANAGED_PROFIT_EXIT_ENABLED:-true}
      Risk__ManagedProfitExitPercentAfterCosts: ${RISK_MANAGED_PROFIT_EXIT_PERCENT_AFTER_COSTS:-5}
      Risk__ManagedQuickProfitExitPercentAfterCosts: ${RISK_MANAGED_QUICK_PROFIT_EXIT_PERCENT_AFTER_COSTS:-8}
      Risk__ManagedTrailingGivebackPercent: ${RISK_MANAGED_TRAILING_GIVEBACK_PERCENT:-0.75}
      Risk__ManagedProfitTrailCandlesAfterTarget: ${RISK_MANAGED_PROFIT_TRAIL_CANDLES_AFTER_TARGET:-1}
      Risk__ManagedExitRequiresMomentumWeakness: ${RISK_MANAGED_EXIT_REQUIRES_MOMENTUM_WEAKNESS:-false}
      Risk__ManagedHardStopExitEnabled: ${RISK_MANAGED_HARD_STOP_EXIT_ENABLED:-false}
      Risk__ManagedExpiryExitEnabled: ${RISK_MANAGED_EXPIRY_EXIT_ENABLED:-false}
      ExchangeExecution__Enabled: ${EXCHANGE_EXECUTION_ENABLED:-true}
      ExchangeExecution__Provider: ${EXCHANGE_EXECUTION_PROVIDER:-BinanceSpot}
      ExchangeExecution__Mode: ${EXCHANGE_EXECUTION_MODE:-Paper}
      ExchangeExecution__BaseUrl: ${EXCHANGE_EXECUTION_BASE_URL:-https://api.binance.com}
      ExchangeExecution__ApiKeyEnvironmentVariable: BINANCE_API_KEY
      ExchangeExecution__ApiSecretEnvironmentVariable: BINANCE_API_SECRET
      ExchangeExecution__AllowLiveOrders: ${EXCHANGE_ALLOW_LIVE_ORDERS:-false}
      ExchangeExecution__UseTestOrderEndpoint: ${EXCHANGE_USE_TEST_ORDER_ENDPOINT:-true}
      ExchangeExecution__MaxCapitalPerTrade: ${EXCHANGE_MAX_CAPITAL_PER_TRADE:-100}
      ExchangeExecution__DailyLossLimit: ${EXCHANGE_DAILY_LOSS_LIMIT:-50}
      ExchangeExecution__MinimumScoreToExecute: ${EXCHANGE_MIN_SCORE_TO_EXECUTE:-95}
      ExchangeExecution__MinimumExpectedNetProfitPercentAfterCosts: ${EXCHANGE_MIN_EXPECTED_NET_PROFIT_AFTER_COSTS:-0.6}
      ExchangeExecution__EnableEntryOrders: ${EXCHANGE_ENABLE_ENTRY_ORDERS:-true}
      ExchangeExecution__EnableExitOrders: ${EXCHANGE_ENABLE_EXIT_ORDERS:-true}
      ExchangeExecution__AllowShortSelling: ${EXCHANGE_ALLOW_SHORT_SELLING:-false}
      ExchangeExecution__ReceiveWindowMilliseconds: ${EXCHANGE_RECV_WINDOW_MS:-5000}
      ExchangeExecution__MaxSlippagePercent: ${EXCHANGE_MAX_SLIPPAGE_PERCENT:-0.25}
      ExchangeExecution__AllowedSymbols__0: ${EXCHANGE_ALLOWED_SYMBOL_0:-BTCUSDT}
      ExchangeExecution__AllowedSymbols__1: ${EXCHANGE_ALLOWED_SYMBOL_1:-ETHUSDT}
      ExchangeExecution__AllowAllSymbols: ${EXCHANGE_ALLOW_ALL_SYMBOLS:-false}
      ExchangeExecution__KillSwitchEnabled: ${EXCHANGE_KILL_SWITCH_ENABLED:-false}
      ExchangeExecution__MaxOpenPositions: ${EXCHANGE_MAX_OPEN_POSITIONS:-3}
      ExchangeExecution__MaxDailyNotional: ${EXCHANGE_MAX_DAILY_NOTIONAL:-500}
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
    volumes:
      - ./logs/web:/app/logs
      - ./logs:/shared-logs:ro
      - web-data-protection:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      sqlserver:
        condition: service_healthy
      sql-init:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    image: trading-monitor-worker:local
    container_name: trading-monitor-worker
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    dns:
      - 1.1.1.1
      - 8.8.8.8
    env_file:
      - .env.local
    environment:
      DOTNET_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      TZ: ${APP_TIME_ZONE:-America/Mexico_City}
      TradingMonitor__DisplayTimeZone: ${APP_TIME_ZONE:-America/Mexico_City}
      Database__Provider: SqlServer
      Database__InitializeOnStartup: "true"
      Database__CreateIfMissing: "true"
      Database__ConnectionString: Server=sqlserver,1433;Database=TradingMarket;User Id=${SQLSERVER_APP_USER:-trading_app};Password=${SQLSERVER_APP_PASSWORD:?Set SQLSERVER_APP_PASSWORD in .env};TrustServerCertificate=True;Encrypt=True;MultipleActiveResultSets=True
      TRADING_MONITOR_LOG_DIRECTORY: /app/logs
      TradingMonitor__Enabled: ${TRADING_MONITOR_ENABLED:-true}
      TradingMonitor__MinimumScore: ${TRADING_MINIMUM_SCORE:-88}
      TradingMonitor__EvaluationIntervalSeconds: ${TRADING_EVALUATION_INTERVAL_SECONDS:-60}
      TradingMonitor__Intervals__0: ${TRADING_INTERVAL_0:-1s}
      TradingMonitor__Intervals__1: ${TRADING_INTERVAL_1:-1m}
      TradingMonitor__Intervals__2: ${TRADING_INTERVAL_2:-5m}
      TradingMonitor__Intervals__3: ${TRADING_INTERVAL_3:-15m}
      TradingMonitor__Intervals__4: ${TRADING_INTERVAL_4:-1h}
      TradingMonitor__Intervals__5: ${TRADING_INTERVAL_5:-4h}
      TradingMonitor__Intervals__6: ${TRADING_INTERVAL_6:-1d}
      TradingMonitor__Intervals__7: ${TRADING_INTERVAL_7:-1w}
      TradingMonitor__Intervals__8: ${TRADING_INTERVAL_8:-1M}
      TradingMonitor__ExternalAiSignalsEnabled: ${EXTERNAL_AI_ENABLED:-true}
      TraderSignals__Enabled: ${TRADER_SIGNALS_ENABLED:-true}
      TraderSignals__BinanceLeaderboardEnabled: ${TRADER_SIGNALS_BINANCE_LEADERBOARD_ENABLED:-true}
      Risk__Target1R: ${RISK_TARGET_1R:-2.2}
      Risk__Target2R: ${RISK_TARGET_2R:-3.4}
      Risk__MinimumRiskReward: ${RISK_MINIMUM_RISK_REWARD:-2.2}
      Risk__EstimatedFeePercentPerSide: ${RISK_FEE_PERCENT_PER_SIDE:-0.1}
      Risk__EstimatedSpreadPercent: ${RISK_SPREAD_PERCENT:-0.05}
      Risk__MinimumNetProfitPercentAfterCosts: ${RISK_MIN_NET_PROFIT_AFTER_COSTS:-0.35}
      Risk__ManagedProfitExitEnabled: ${RISK_MANAGED_PROFIT_EXIT_ENABLED:-true}
      Risk__ManagedProfitExitPercentAfterCosts: ${RISK_MANAGED_PROFIT_EXIT_PERCENT_AFTER_COSTS:-5}
      Risk__ManagedQuickProfitExitPercentAfterCosts: ${RISK_MANAGED_QUICK_PROFIT_EXIT_PERCENT_AFTER_COSTS:-8}
      Risk__ManagedTrailingGivebackPercent: ${RISK_MANAGED_TRAILING_GIVEBACK_PERCENT:-0.75}
      Risk__ManagedProfitTrailCandlesAfterTarget: ${RISK_MANAGED_PROFIT_TRAIL_CANDLES_AFTER_TARGET:-1}
      Risk__ManagedExitRequiresMomentumWeakness: ${RISK_MANAGED_EXIT_REQUIRES_MOMENTUM_WEAKNESS:-false}
      Risk__ManagedHardStopExitEnabled: ${RISK_MANAGED_HARD_STOP_EXIT_ENABLED:-false}
      Risk__ManagedExpiryExitEnabled: ${RISK_MANAGED_EXPIRY_EXIT_ENABLED:-false}
      MarketSources__BinanceEnabled: ${MARKET_BINANCE_ENABLED:-true}
      MarketSources__BinanceUsEnabled: ${MARKET_BINANCE_US_ENABLED:-true}
      MarketSources__CoinbaseEnabled: ${MARKET_COINBASE_ENABLED:-true}
      MarketSources__KrakenEnabled: ${MARKET_KRAKEN_ENABLED:-true}
      MarketSources__YahooFinanceForexEnabled: ${MARKET_YAHOO_FOREX_ENABLED:-true}
      MarketSources__AlphaVantageForexEnabled: ${MARKET_ALPHA_VANTAGE_FOREX_ENABLED:-true}
      MarketSources__BinanceBaseUrl: ${BINANCE_BASE_URL:-https://api.binance.com}
      MarketSources__BinanceUsBaseUrl: ${BINANCE_US_BASE_URL:-https://api.binance.us}
      MarketSources__CoinbaseBaseUrl: ${COINBASE_BASE_URL:-https://api.exchange.coinbase.com}
      MarketSources__KrakenBaseUrl: ${KRAKEN_BASE_URL:-https://api.kraken.com}
      MarketSources__YahooFinanceBaseUrl: ${YAHOO_FINANCE_BASE_URL:-https://query1.finance.yahoo.com}
      MarketSources__AlphaVantageBaseUrl: ${ALPHA_VANTAGE_BASE_URL:-https://www.alphavantage.co}
      MarketSources__AlphaVantageApiKeyEnvironmentVariable: ALPHA_VANTAGE_API_KEY
      MarketSources__TimeoutSeconds: ${MARKET_TIMEOUT_SECONDS:-10}
      News__Enabled: ${NEWS_ENABLED:-true}
      News__FearGreedEnabled: ${NEWS_FEAR_GREED_ENABLED:-true}
      News__CryptoPanicEnabled: ${NEWS_CRYPTOPANIC_ENABLED:-true}
      News__CryptoPanicAuthTokenEnvironmentVariable: CRYPTOPANIC_AUTH_TOKEN
      CRYPTOPANIC_AUTH_TOKEN: ${CRYPTOPANIC_AUTH_TOKEN:-}
      OpenAi__Enabled: ${OPENAI_ENABLED:-true}
      OpenAi__ApiKeyEnvironmentVariable: OPENAI_API_KEY
      OpenAi__BaseUrl: ${OPENAI_BASE_URL:-https://api.openai.com}
      OpenAi__Model: ${OPENAI_MODEL:-gpt-5.6-terra}
      OpenAi__ReasoningEffort: ${OPENAI_REASONING_EFFORT:-low}
      OpenAi__TextVerbosity: ${OPENAI_TEXT_VERBOSITY:-low}
      OpenAi__TimeoutSeconds: ${OPENAI_TIMEOUT_SECONDS:-20}
      OpenAi__MaxNewsItems: ${OPENAI_MAX_NEWS_ITEMS:-12}
      OpenAi__MinimumNewsItemsToAnalyze: ${OPENAI_MIN_NEWS_ITEMS_TO_ANALYZE:-3}
      OpenAi__MinimumMinutesBetweenCalls: ${OPENAI_MIN_MINUTES_BETWEEN_CALLS:-15}
      OpenAi__MaxPromptCharacters: ${OPENAI_MAX_PROMPT_CHARACTERS:-6000}
      OpenAi__OnlyAnalyzeWhenNewsChanged: ${OPENAI_ONLY_ANALYZE_WHEN_NEWS_CHANGED:-true}
      Reporting__DefaultCapital: ${REPORTING_DEFAULT_CAPITAL:-1000}
      Reporting__EstimatedFeePercentPerSide: ${REPORTING_FEE_PERCENT_PER_SIDE:-0.1}
      Reporting__MinimumNetProfitPercentAfterCosts: ${REPORTING_MIN_NET_PROFIT_AFTER_COSTS:-0.35}
      ExchangeExecution__Enabled: ${EXCHANGE_EXECUTION_ENABLED:-true}
      ExchangeExecution__Provider: ${EXCHANGE_EXECUTION_PROVIDER:-BinanceSpot}
      ExchangeExecution__Mode: ${EXCHANGE_EXECUTION_MODE:-Paper}
      ExchangeExecution__BaseUrl: ${EXCHANGE_EXECUTION_BASE_URL:-https://api.binance.com}
      ExchangeExecution__ApiKeyEnvironmentVariable: BINANCE_API_KEY
      ExchangeExecution__ApiSecretEnvironmentVariable: BINANCE_API_SECRET
      ExchangeExecution__AllowLiveOrders: ${EXCHANGE_ALLOW_LIVE_ORDERS:-false}
      ExchangeExecution__UseTestOrderEndpoint: ${EXCHANGE_USE_TEST_ORDER_ENDPOINT:-true}
      ExchangeExecution__MaxCapitalPerTrade: ${EXCHANGE_MAX_CAPITAL_PER_TRADE:-100}
      ExchangeExecution__DailyLossLimit: ${EXCHANGE_DAILY_LOSS_LIMIT:-50}
      ExchangeExecution__MinimumScoreToExecute: ${EXCHANGE_MIN_SCORE_TO_EXECUTE:-95}
      ExchangeExecution__MinimumExpectedNetProfitPercentAfterCosts: ${EXCHANGE_MIN_EXPECTED_NET_PROFIT_AFTER_COSTS:-0.6}
      ExchangeExecution__EnableEntryOrders: ${EXCHANGE_ENABLE_ENTRY_ORDERS:-true}
      ExchangeExecution__EnableExitOrders: ${EXCHANGE_ENABLE_EXIT_ORDERS:-true}
      ExchangeExecution__AllowShortSelling: ${EXCHANGE_ALLOW_SHORT_SELLING:-false}
      ExchangeExecution__ReceiveWindowMilliseconds: ${EXCHANGE_RECV_WINDOW_MS:-5000}
      ExchangeExecution__MaxSlippagePercent: ${EXCHANGE_MAX_SLIPPAGE_PERCENT:-0.25}
      ExchangeExecution__AllowedSymbols__0: ${EXCHANGE_ALLOWED_SYMBOL_0:-BTCUSDT}
      ExchangeExecution__AllowedSymbols__1: ${EXCHANGE_ALLOWED_SYMBOL_1:-ETHUSDT}
      ExchangeExecution__AllowAllSymbols: ${EXCHANGE_ALLOW_ALL_SYMBOLS:-false}
      ExchangeExecution__KillSwitchEnabled: ${EXCHANGE_KILL_SWITCH_ENABLED:-false}
      ExchangeExecution__MaxOpenPositions: ${EXCHANGE_MAX_OPEN_POSITIONS:-3}
      ExchangeExecution__MaxDailyNotional: ${EXCHANGE_MAX_DAILY_NOTIONAL:-500}
      TRADING_MONITOR_LIVE_CONFIRM: ${TRADING_MONITOR_LIVE_CONFIRM:-}
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      Notifications__ConsoleEnabled: ${NOTIFICATIONS_CONSOLE_ENABLED:-true}
      Notifications__Email__Enabled: ${EMAIL_ENABLED:-false}
      Notifications__Email__Host: ${EMAIL_HOST:-}
      Notifications__Email__Port: ${EMAIL_PORT:-587}
      Notifications__Email__UseSsl: ${EMAIL_USE_SSL:-true}
      Notifications__Email__UserName: ${EMAIL_USERNAME:-}
      Notifications__Email__PasswordEnvironmentVariable: EMAIL_PASSWORD
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      Notifications__Email__From: ${EMAIL_FROM:-}
      Notifications__Email__To: ${EMAIL_TO:-}
      Notifications__Telegram__Enabled: ${TELEGRAM_ENABLED:-false}
      Notifications__Telegram__BotTokenEnvironmentVariable: TELEGRAM_BOT_TOKEN
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      Notifications__Telegram__ChatId: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./logs/worker:/app/logs
    depends_on:
      sqlserver:
        condition: service_healthy
      sql-init:
        condition: service_completed_successfully

volumes:
  sqlserver-data:
  web-data-protection:
