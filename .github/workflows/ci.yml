name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore locked dependencies
        run: dotnet restore Trading.Monitor.sln --locked-mode
      - name: Build
        run: dotnet build Trading.Monitor.sln --configuration Release --no-restore
      - name: Test with coverage
        run: dotnet test Trading.Monitor.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults
      - name: Audit dependencies
        run: dotnet list Trading.Monitor.sln package --vulnerable --include-transitive
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        image: [web, worker]
    steps:
      - uses: actions/checkout@v7
      - name: Build ${{ matrix.image }} image
        run: docker build --file docker/${{ matrix.image }}.Dockerfile --tag trading-monitor-${{ matrix.image }}:ci .
      - name: Scan ${{ matrix.image }} image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: trading-monitor-${{ matrix.image }}:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
